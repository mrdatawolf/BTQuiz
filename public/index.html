<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>General IT Questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;700;800&family=Work+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">

    <!-- Attract screen: shown when idle, invites the next visitor to tap -->
    <section id="screen-attract" class="screen active">
      <div class="attract-content">
        <div class="attract-badge">Event Quiz</div>
        <h1 id="attract-title">General IT Questions</h1>
        <p id="attract-subtitle">Tap to test your knowledge</p>
        <div class="category-grid" id="category-grid"></div>
      </div>
    </section>

    <!-- Question screen -->
    <section id="screen-question" class="screen">
      <header class="quiz-header">
        <span class="category-pill" id="q-category">Category</span>
        <div class="progress-dots" id="progress-dots"></div>
      </header>
      <div class="question-body">
        <h2 id="q-text">Question text goes here</h2>
        <div class="answers-grid" id="answers-grid"></div>
      </div>
    </section>

    <!-- Feedback overlay: correct / incorrect -->
    <section id="screen-feedback" class="screen feedback">
      <div class="feedback-card">
        <div class="feedback-icon" id="feedback-icon">✓</div>
        <div class="feedback-label" id="feedback-label">Correct!</div>
        <p class="feedback-explanation" id="feedback-explanation"></p>
        <button class="tap-target continue-btn" id="continue-btn">Tap to Continue</button>
      </div>
    </section>

    <!-- Results screen -->
    <section id="screen-results" class="screen">
      <div class="results-content">
        <div class="results-badge" id="results-emoji">🎉</div>
        <h2 id="results-headline">Nice work!</h2>
        <p class="results-score"><span id="results-score">0</span> / <span id="results-total">0</span> correct</p>
        <div class="results-actions">
          <button class="tap-target secondary" id="review-btn">Review Answers</button>
          <button class="tap-target" id="again-btn">Play Again</button>
        </div>
        <div class="auto-reset-bar"><div class="auto-reset-fill" id="results-auto-reset-fill"></div></div>
        <p class="auto-reset-note">Returning to start automatically&hellip;</p>
      </div>
    </section>

    <!-- Review screen: recap of every question in the round, shown at the end -->
    <section id="screen-review" class="screen">
      <header class="review-header">
        <h2>Round Review</h2>
        <span class="review-score"><span id="review-score">0</span> / <span id="review-total">0</span> correct</span>
      </header>
      <div class="review-list" id="review-list"></div>
      <div class="review-footer">
        <button class="tap-target" id="review-done-btn">Tap to Continue</button>
        <div class="auto-reset-bar"><div class="auto-reset-fill" id="review-auto-reset-fill"></div></div>
      </div>
    </section>

    <!-- Staff control: bail out of a stuck round back to the start screen -->
    <button id="reset-btn" class="reset-btn" hidden>&#8635; Reset</button>

    <div id="reset-confirm" class="reset-confirm" hidden>
      <div class="reset-confirm-card">
        <h3>Reset the quiz?</h3>
        <p>This clears the current round and returns to the start screen.</p>
        <div class="reset-confirm-actions">
          <button class="tap-target secondary" id="reset-cancel-btn">Cancel</button>
          <button class="tap-target" id="reset-confirm-btn">Reset Now</button>
        </div>
      </div>
    </div>

  </div>
  <script src="app.js"></script>
</body>
</html>
